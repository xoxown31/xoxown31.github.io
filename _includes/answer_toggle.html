<script>
(function () {
  if (window.__AnswerToggleInit) return; // 중복 방지
  window.__AnswerToggleInit = true;

  function enhance(bq, idx) {
    const isTitled = bq.classList.contains('answer-title');

    // 기존 자식 보관
    const frag = document.createDocumentFragment();
    [...bq.childNodes].forEach(n => frag.appendChild(n));

    // 라벨 결정: answer-title이면 첫 번째 <p>를 버튼 라벨로 사용
    let labelText = '정답 보기';
    if (isTitled) {
      const firstP = frag.querySelector && frag.querySelector('p');
      if (firstP && firstP.textContent.trim()) {
        labelText = firstP.textContent.trim();
        firstP.remove();
      }
    } else if (bq.dataset.answerLabel) {
      labelText = bq.dataset.answerLabel;
    }

    // 키(페이지 경로 + 고유 id/index)로 open 상태 영구 저장
    const key = 'jtd-answer:' + location.pathname + '#' + (bq.id || idx);

    // 래퍼/버튼/내용 컨테이너 구성
    const wrap = document.createElement('div');
    wrap.className = 'answer-wrap';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'answer-toggle';
    btn.setAttribute('aria-expanded', 'false');
    const contentId = (bq.id || ('answer-'+idx)) + '-content';
    btn.setAttribute('aria-controls', contentId);
    btn.innerHTML = '<span class="caret" aria-hidden="true"></span><span class="label"></span>';
    btn.querySelector('.label').textContent = labelText;

    const content = document.createElement('div');
    content.className = 'answer-content';
    content.id = contentId;
    content.appendChild(frag);

    wrap.appendChild(btn);
    wrap.appendChild(content);
    bq.appendChild(wrap);

    // 초기 상태 복원
    const saved = localStorage.getItem(key);
    const open = saved === '1';
    bq.setAttribute('data-open', open ? 'true' : 'false');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');

    btn.addEventListener('click', () => {
      const nowOpen = bq.getAttribute('data-open') !== 'true';
      bq.setAttribute('data-open', nowOpen ? 'true' : 'false');
      btn.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
      try { localStorage.setItem(key, nowOpen ? '1' : '0'); } catch (e) {}
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    const list = document.querySelectorAll('blockquote.answer, blockquote.answer-title');
    list.forEach((bq, i) => enhance(bq, i));
  });
})();
</script>
